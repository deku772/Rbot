import org.gradle.api.file.RelativePath

plugins {
    id "com.android.application"
}

android {
    namespace = "app.rbot"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    defaultConfig {
        applicationId "app.rbot"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        // Auto-increment version code based on git commit count
        versionCode getVersionCode()
        // Version name: MAJOR.MINOR.PATCH-gitCommitCount (e.g., 1.0.0-123)
        versionName getVersionName()

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "app.rbot"
        manifestPlaceholders.TERMUX_APP_NAME = "Rbot"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:deprecation"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.0"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.viewpager:viewpager:1.0.0"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "io.noties.markwon:core:$markwonVersion"
    implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
    implementation "io.noties.markwon:linkify:$markwonVersion"
    implementation "io.noties.markwon:recycler:$markwonVersion"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

// Auto-increment version based on git commits
def getVersionCode() {
    try {
        // Use rootProject.rootDir to ensure we start from the git repository root
        def workingDir = rootProject.rootDir
        // Use array form for ProcessBuilder to avoid shell parsing issues on Windows
        def process = new ProcessBuilder(["git", "rev-list", "--count", "HEAD"])
            .directory(workingDir)
            .redirectErrorStream(true)
            .start()
        process.waitFor(10, java.util.concurrent.TimeUnit.SECONDS)
        def output = process.inputStream.text.trim()
        if (output.isEmpty() || !output.isNumber()) {
            return 1
        }
        return output.toInteger()
    } catch (Exception e) {
        println "Warning: Failed to get git version code: ${e.message}"
        return 1
    }
}

def getVersionName() {
    try {
        def commitCount = getVersionCode()
        return "1.0.${commitCount}"
    } catch (Exception e) {
        return "1.0.0"
    }
}

tasks.register('versionName') {
    doLast {
        println getVersionName()
    }
}
