name: Build Release APK

on:
  push:
    branches:
      - root
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (e.g., beta1, rc1)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download bootstrap archive
        run: |
          echo "Downloading Termux official bootstrap archive..."
          cd app/src/main/cpp
          curl -fsSL -L -o "bootstrap-aarch64.zip" \
            "https://github.com/termux/termux-packages/releases/download/bootstrap-2026.04.05-r1+apt.android-7/bootstrap-aarch64.zip"
          SIZE=$(stat --printf='%s' bootstrap-aarch64.zip)
          echo "Downloaded bootstrap-aarch64.zip ($SIZE bytes)"
          # Sanity check: official bootstrap is ~29MB, bloated ones are 100MB+
          if [ "$SIZE" -gt 50000000 ]; then
            echo "::error::bootstrap-aarch64.zip is ${SIZE} bytes (>50MB), expected ~29MB from official Termux"
            exit 1
          fi

      - name: Decode signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::No SIGNING_KEY secret found, skipping release signing"
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 -d > app/release-key.jks

      - name: Build Release APK
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          # Resolve version
          CURRENT_VERSION_NAME="2.0.0"
          VERSION_SUFFIX="${{ github.event.inputs.version_suffix }}"

          if [ -n "$VERSION_SUFFIX" ]; then
            RELEASE_VERSION_NAME="v${CURRENT_VERSION_NAME}-${VERSION_SUFFIX}+${GITHUB_SHA:0:7}"
          else
            RELEASE_VERSION_NAME="v${CURRENT_VERSION_NAME}+${GITHUB_SHA:0:7}"
          fi

          APK_DIR_PATH="./app/build/outputs/apk/release"
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "RELEASE_VERSION_NAME=$RELEASE_VERSION_NAME" >> $GITHUB_ENV

          echo "Building Release APK: $RELEASE_VERSION_NAME"

          if [ -f "app/release-key.jks" ] && [ -n "$SIGNING_KEY_ALIAS" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release-key.jks \
              -Pandroid.injected.signing.store.password="$SIGNING_KEY_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"
          else
            echo "No signing key configured, building unsigned release APK"
            ./gradlew assembleRelease
          fi

          echo "Validating APKs..."
          ls -la "$APK_DIR_PATH/"

          echo "Generating sha256sums..."
          cd "$APK_DIR_PATH"
          sha256sum *.apk > sha256sums.txt
          cat sha256sums.txt

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rbot-${{ env.RELEASE_VERSION_NAME }}
          path: |
            ${{ env.APK_DIR_PATH }}/*.apk
            ${{ env.APK_DIR_PATH }}/sha256sums.txt

      - name: Restore annotated tag
        if: startsWith(github.ref, 'refs/tags/')
        run: git fetch origin tag "${{ github.ref_name }}" --force

      - name: Resolve release channel
        if: startsWith(github.ref, 'refs/tags/')
        id: release_channel
        run: |
          tag_name="${{ github.ref_name }}"
          tag_message=""
          if git for-each-ref "refs/tags/$tag_name" >/dev/null 2>&1; then
            tag_type="$(git for-each-ref --format='%(objecttype)' "refs/tags/$tag_name")"
            if [[ "$tag_type" == "tag" ]]; then
              tag_message="$(git for-each-ref --format='%(contents)' "refs/tags/$tag_name")"
            fi
          fi
          if [[ "$tag_message" == *"[rbot:draft]"* ]]; then
            echo "is_draft=true" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_draft=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_DIR_PATH }}/*.apk
            ${{ env.APK_DIR_PATH }}/sha256sums.txt
          draft: ${{ steps.release_channel.outputs.is_draft == 'true' }}
          prerelease: ${{ steps.release_channel.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
