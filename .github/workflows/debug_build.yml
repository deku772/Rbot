name: Build Debug APK

on:
  pull_request:
    branches:
      - root
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          set -e

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            GITHUB_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          CURRENT_VERSION_NAME=$(grep 'versionName "' app/build.gradle | head -1 | sed 's/.*versionName "//;s/".*//')
          echo "Detected version from build.gradle: $CURRENT_VERSION_NAME"

          RELEASE_VERSION_NAME="v${CURRENT_VERSION_NAME}+${GITHUB_SHA:0:7}"

          APK_DIR_PATH="./app/build/outputs/apk/debug"

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "RELEASE_VERSION_NAME=$RELEASE_VERSION_NAME" >> $GITHUB_ENV

          echo "Building Debug APK: $RELEASE_VERSION_NAME"

          ./gradlew assembleDebug

          echo "Validating APKs..."
          ls -la "$APK_DIR_PATH/"

          echo "Generating sha256sums..."
          cd "$APK_DIR_PATH"
          sha256sum *.apk > sha256sums.txt
          cat sha256sums.txt

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rbot-debug-${{ env.RELEASE_VERSION_NAME }}
          path: |
            ${{ env.APK_DIR_PATH }}/*.apk
            ${{ env.APK_DIR_PATH }}/sha256sums.txt
